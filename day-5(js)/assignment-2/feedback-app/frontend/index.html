<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workshop Feedback Wall</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { font-size: 24px; margin-bottom: 6px; }
    p.sub { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #error-box {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .hidden { display: none; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    li {
      background: #fff;
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    li strong { display: block; font-size: 14px; margin-bottom: 4px; }
    li span { font-size: 14px; color: #334155; }
  </style>
</head>
<body>
  <h1>Workshop Feedback Wall</h1>
  <p class="sub">Submit your feedback to our Express backend!</p>

  <div id="error-box" class="hidden"></div>

  <form id="feedback-form">
    <input type="text" id="user-name" placeholder="Your Name" required />
    <textarea id="user-message" rows="3" placeholder="Your feedback (min 5 characters)..." required></textarea>
    <button type="submit">Post Feedback</button>
  </form>

  <ul id="feedback-list"></ul>

  <script src="script.js"></script>
</body>
</html>
